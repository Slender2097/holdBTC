<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blocksize War &amp; UASF Victory</title>
<style>
/* Text-free 24s loop, pizza-style cartoon:
   WAR (0-13s): chubby angry Big Blocks fire a cannon at a shield wall of tiny helmeted nodes. The SegWit chest stays locked.
   VICTORY (14-23s): the UASF flag rises, the chest pops open, the big blocks shrink away, miners surrender and switch sides. */
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(#cfe8f0 0%,#fdf0c8 55%,#f9d98b 100%)}
.k{animation-duration:24s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.fb{transform-box:fill-box;transform-origin:center}
#tint{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 25% 100%,rgba(230,90,70,.32),transparent 60%),linear-gradient(rgba(150,120,150,.25),transparent 70%);animation-name:tint}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.cl{position:absolute;top:var(--y);left:0;animation:cloud var(--t) linear infinite;animation-delay:var(--dl);opacity:.75}
.cl path{animation:cloudc 24s ease-in-out infinite}
@keyframes cloud{from{transform:translateX(-25vw)}to{transform:translateX(115vw)}}
.cf{position:absolute;top:-20px;left:var(--x);width:var(--s);height:calc(var(--s)*1.6);background:var(--c);animation:cfall var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes cfall{from{transform:translateY(0) rotate(0)}to{transform:translateY(112vh) rotate(540deg)}}
#sun{position:fixed;right:3vw;top:4vh;width:clamp(90px,16vmin,170px);pointer-events:none;animation:sunb 4s ease-in-out infinite alternate}
@keyframes sunb{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-8px) rotate(4deg)}}
#stage{position:fixed;left:0;bottom:0;width:100%;pointer-events:none}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob .45s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes bob{to{transform:translateY(-6px)}}
.wad{transform-box:fill-box;transform-origin:50% 100%;animation:wad .7s ease-in-out infinite alternate}
@keyframes wad{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.tum{transform-box:fill-box;transform-origin:center;animation:tum .9s linear infinite}
@keyframes tum{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp .7s linear infinite}
@keyframes sp{50%{transform:scaleX(.25)}}
.fwv{transform-box:fill-box;transform-origin:0% 50%;animation:fw .6s ease-in-out infinite alternate}
@keyframes fw{from{transform:skewY(-4deg)}to{transform:skewY(4deg)}}
.trem{animation:trem .2s ease-in-out infinite alternate}
@keyframes trem{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.cfs{transform-box:fill-box;transform-origin:center;animation:cfs var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes cfs{from{transform:translateY(0) rotate(0)}to{transform:translateY(520px) rotate(420deg)}}
.hup{animation:hup 2.6s ease-out infinite;animation-delay:var(--dl)}
@keyframes hup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-130px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style id="kf"></style>
<style id="camkf"></style>
</head>
<body>
<div id="tint" class="k" aria-hidden="true"></div>
<div id="sky" aria-hidden="true"></div>

<!-- the sun: grumpy in a helmet during the war, happy after -->
<svg id="sun" viewBox="0 0 200 200" aria-hidden="true">
  <g id="rays" stroke="#ffb84a" stroke-width="9" stroke-linecap="round"></g>
  <circle cx="100" cy="112" r="70" fill="#ffd45a" stroke="#e8973a" stroke-width="7"/>
  <path d="M38 84A62 58 0 0 1 162 84L162 98H38Z" fill="#8d97ab" stroke="#3b4460" stroke-width="6" stroke-linejoin="round"/><path d="M100 28V98" stroke="#3b4460" stroke-width="6"/>
  <g class="k" style="animation-name:sunA"><path d="M62 112 92 124M138 112 108 124" stroke="#5a2f00" stroke-width="7" stroke-linecap="round"/><circle cx="78" cy="134" r="8" fill="#fff"/><circle cx="122" cy="134" r="8" fill="#fff"/><circle cx="80" cy="136" r="3.5" fill="#222"/><circle cx="120" cy="136" r="3.5" fill="#222"/><path d="M78 170Q100 152 122 170" fill="none" stroke="#5a2f00" stroke-width="7" stroke-linecap="round"/></g>
  <g class="k" style="animation-name:sunB" opacity="0"><path d="M64 134Q78 118 92 134M108 134Q122 118 136 134" fill="none" stroke="#5a2f00" stroke-width="7" stroke-linecap="round"/><circle cx="62" cy="150" r="10" fill="#ff8fa3" opacity=".6"/><circle cx="138" cy="150" r="10" fill="#ff8fa3" opacity=".6"/><path d="M72 154Q100 190 128 154Z" fill="#a3243a" stroke="#5a2f00" stroke-width="6" stroke-linejoin="round"/></g>
</svg>

<svg id="stage" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
<defs>
  <filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
  <radialGradient id="glow"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
  <symbol id="coin" viewBox="-20 -20 40 40"><circle r="18" fill="#e8973a" stroke="#222" stroke-width="4"/><circle r="12" fill="none" stroke="#222" stroke-width="2.5" opacity=".5"/><text y="7" text-anchor="middle" font-size="20" font-weight="900" fill="#222" font-family="Arial,sans-serif">₿</text><path d="M-11 -8a13 13 0 0 1 8-7" stroke="#fff5cc" stroke-width="3" fill="none" stroke-linecap="round"/></symbol>
  <!-- tiny hero node: green cube with helmet -->
  <g id="nodeG"><path d="M-14 -20V-2M10 -20V-2" stroke="#1f6b3a" stroke-width="12" stroke-linecap="round"/><path d="M-24 -38-36 -26M24 -38 36 -26" stroke="#1f6b3a" stroke-width="6" stroke-linecap="round"/><rect x="-24" y="-62" width="48" height="44" rx="11" fill="#7fd98f" stroke="#1f6b3a" stroke-width="4"/><path d="M-28 -56A28 26 0 0 1 28 -56Z" fill="#8d97ab" stroke="#3b4460" stroke-width="4" stroke-linejoin="round"/><circle cx="-10" cy="-42" r="5.5" fill="#fff"/><circle cx="10" cy="-42" r="5.5" fill="#fff"/><circle cx="-9" cy="-41" r="2.6" fill="#222"/><circle cx="11" cy="-41" r="2.6" fill="#222"/><path d="M-9 -30Q0 -22 9 -30" fill="none" stroke="#1f6b3a" stroke-width="3.5" stroke-linecap="round"/></g>
  <!-- chubby Big Block -->
  <g id="bigBody"><rect x="-34" y="-20" width="22" height="20" rx="6" fill="#a8471a"/><rect x="12" y="-20" width="22" height="20" rx="6" fill="#a8471a"/><rect x="-54" y="-112" width="108" height="96" rx="18" fill="#ff9a4d" stroke="#a8471a" stroke-width="6"/></g>
  <g id="faceA"><path d="M-32 -78-8 -66M32 -78 8 -66" stroke="#5a1f0a" stroke-width="7" stroke-linecap="round"/><circle cx="-18" cy="-58" r="9" fill="#fff"/><circle cx="18" cy="-58" r="9" fill="#fff"/><circle cx="-14" cy="-56" r="3.6" fill="#222"/><circle cx="14" cy="-56" r="3.6" fill="#222"/><path d="M-18 -30Q0 -46 18 -30" fill="none" stroke="#5a1f0a" stroke-width="6" stroke-linecap="round"/></g>
  <g id="faceB"><circle cx="-18" cy="-58" r="9" fill="#fff"/><circle cx="18" cy="-58" r="9" fill="#fff"/><circle cx="-20" cy="-55" r="3.6" fill="#222"/><circle cx="16" cy="-55" r="3.6" fill="#222"/><path d="M-16 -34q8-7 16 0t16 0" fill="none" stroke="#5a1f0a" stroke-width="5" stroke-linecap="round"/><path d="M40 -92q-7 10 0 16 7-6 0-16Z" fill="#8fd4ff" stroke="#3a86c0" stroke-width="2.5"/></g>
  <!-- miner robot with pickaxe -->
  <g id="minerG"><path d="M-14 -20V0M4 -20V0" stroke="#4b5468" stroke-width="10" stroke-linecap="round"/><path d="M26 -66 46 -116" stroke="#8a5a2b" stroke-width="7" stroke-linecap="round"/><path d="M28 -114Q50 -130 70 -106" fill="none" stroke="#3b4460" stroke-width="8" stroke-linecap="round"/><path d="M20 -58 34 -72" stroke="#4b5468" stroke-width="8" stroke-linecap="round"/><rect x="-20" y="-72" width="40" height="52" rx="8" fill="#b9c0cd" stroke="#4b5468" stroke-width="5"/><rect x="-22" y="-112" width="44" height="36" rx="9" fill="#b9c0cd" stroke="#4b5468" stroke-width="5"/><circle cx="-9" cy="-94" r="6" fill="#ffe27a" stroke="#b9770e" stroke-width="2.5"/><circle cx="9" cy="-94" r="6" fill="#ffe27a" stroke="#b9770e" stroke-width="2.5"/><path d="M-27 -108A27 20 0 0 1 27 -108Z" fill="#ffd45a" stroke="#b9770e" stroke-width="4" stroke-linejoin="round"/></g>
</defs>

<g id="cam" class="k" style="animation-name:cam"><g class="k" style="animation-name:stg" opacity="0">

  <!-- ground -->
  <path d="M-900 430-700 330-500 410-300 320-80 420 140 340 330 430 560 330 800 430 1030 340 1250 430 1500 330 1720 420 1950 350 2150 430 2400 340 2700 430Z" fill="#bfe3c0" opacity=".75"/>
  <g filter="url(#crayon)"><rect x="-900" y="430" width="3600" height="200" fill="#8fd18f" stroke="#4a9a4a" stroke-width="6"/></g>
  <path d="M-900 490H2700" stroke="#e8f7d0" stroke-width="5" stroke-dasharray="70 60" opacity=".7"/>

  <!-- the locked chest (SegWit) in no-man's land -->
  <g transform="translate(930 430)">
    <circle class="k" style="animation-name:cgl" cy="-70" r="140" fill="url(#glow)" opacity="0"/>
    <g class="trem"><g filter="url(#crayon)"><rect x="-55" y="-60" width="110" height="60" rx="6" fill="#c98a4a" stroke="#6b3f12" stroke-width="5"/><rect x="-55" y="-42" width="110" height="8" fill="#8a5a2b"/></g>
      <g class="k fb" style="animation-name:lid;transform-origin:0% 100%"><path d="M-55 -60Q0 -112 55 -60Z" fill="#d99c58" stroke="#6b3f12" stroke-width="5" stroke-linejoin="round"/></g>
      <g class="k fb" style="animation-name:plock"><rect x="-14" y="-52" width="28" height="22" rx="4" fill="#ffd45a" stroke="#b9770e" stroke-width="4"/><path d="M-8 -52v-8a8 8 0 0 1 16 0v8" fill="none" stroke="#b9770e" stroke-width="5"/></g></g>
  </g>

  <!-- BIG BLOCK ARMY (left): miners behind, chubby cubes in front, cannon -->
  <g id="minersG" class="k" style="animation-name:minersG"></g>
  <g id="cubesG" class="k fb" style="animation-name:cubesG;transform-origin:50% 100%"></g>
  <g class="k" style="animation-name:recoil"><g transform="translate(200 392) rotate(-22)"><rect x="0" y="-20" width="92" height="40" rx="10" fill="#3d3660" stroke="#231d3d" stroke-width="5"/><rect x="74" y="-24" width="14" height="48" rx="4" fill="#5b4f9a" stroke="#231d3d" stroke-width="4"/></g></g>
  <circle cx="196" cy="408" r="32" fill="#6b5fa8" stroke="#231d3d" stroke-width="5"/><circle cx="196" cy="408" r="8" fill="#231d3d"/><path d="M196 380V436M168 408H224M176 388 216 428M216 388 176 428" stroke="#231d3d" stroke-width="3"/>

  <!-- USERS (right): shield wall of tiny nodes + the UASF flag -->
  <g id="usersG" class="k" style="animation-name:usersG"></g>
  <g transform="translate(1150 345)"><g class="k fb" style="animation-name:shk"><circle r="74" fill="#7fd98f" stroke="#ffd45a" stroke-width="12"/><circle r="54" fill="none" stroke="#1f6b3a" stroke-width="5" opacity=".6"/><path d="M-28 4-8 26 30-20" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <g transform="translate(1712 430)"><rect x="-4" y="-250" width="8" height="250" rx="4" fill="#8a5a2b" stroke="#6b3f12" stroke-width="3"/><circle cy="-254" r="10" fill="#ffd45a" stroke="#b9770e" stroke-width="3"/>
    <g class="k" style="animation-name:fraise"><g class="fwv"><path d="M4 -236C44 -252 84 -220 124 -236V-172C84 -156 44 -188 4 -172Z" fill="#7fd98f" stroke="#1f6b3a" stroke-width="5"/><path d="M40 -204 56 -188 88 -222" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>

  <g id="flights"></g><g id="sparks"></g><g id="vic" class="k" style="animation-name:vicG" opacity="0"></g>
</g></g>
</svg>

<script>
(function(){
  var WW=1800,H=520,D=24,i,j,W=WW,pan=false,$=function(id){return document.getElementById(id)};
  function pc(s){return (s/D*100).toFixed(3)+'%'}
  function kf(n,st){var l=st[st.length-1];if(l[0]<D)st=st.concat([[D,l[1]]]);return '@keyframes '+n+'{'+st.map(function(x){return pc(x[0])+'{'+x[1]+'}'}).join('')+'}'}
  var seed=9;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}

  /* ---------- sun rays ---------- */
  var rs='';for(i=0;i<12;i++){var a=i*Math.PI/6;rs+='<path d="M'+(100+84*Math.cos(a))+' '+(112+84*Math.sin(a))+'L'+(100+98*Math.cos(a))+' '+(112+98*Math.sin(a))+'"/>'}
  $('rays').innerHTML=rs;

  /* ---------- sky: stormy clouds that turn white, confetti in the victory ---------- */
  var sk='';
  for(i=0;i<3;i++)sk+='<div class="cl" style="--y:'+(6+i*12)+'%;--t:'+(90+i*25)+'s;--dl:-'+(i*38)+'s"><svg width="'+(130+i*30)+'" height="64" viewBox="0 0 96 48"><path d="M14 42a12 12 0 0 1-2-24 18 18 0 0 1 34-6 16 16 0 0 1 28 10 11 11 0 0 1-2 20Z" stroke="#222" stroke-width="3.5" stroke-linejoin="round"/></svg></div>';
  var cc=['#ff6b6b','#f5c542','#2b8a3e','#5aa9e6','#b7a3e0'],cfs='';
  for(i=0;i<16;i++)cfs+='<div class="cf" style="--x:'+(rnd()*98)+'%;--s:'+(6+rnd()*6)+'px;--c:'+cc[i%5]+';--t:'+(5+rnd()*4)+'s;--dl:-'+(rnd()*8)+'s"></div>';
  sk+='<div class="k" style="animation-name:vicG;position:absolute;inset:0;opacity:0">'+cfs+'</div>';
  $('sky').innerHTML=sk;

  /* ---------- responsive stage + camera (pans on phones) ---------- */
  function layout(){
    var vw=innerWidth,vh=innerHeight,hFit=vw*H/WW,h=hFit>=.30*vh?Math.min(hFit,.46*vh):.38*vh;
    W=vw*H/h;pan=W<WW;var vx=W>=WW?(WW-W)/2:0,s=$('stage');
    s.style.height=h+'px';s.setAttribute('viewBox',vx+' 0 '+W+' '+H);
    function tx(f){return pan?Math.max(W-WW,Math.min(0,W/2-f)):0}
    var F=[[0,900],[12.6,900],[14.4,1350],[22.6,1350],[24,900]];
    $('camkf').textContent=kf('cam',F.map(function(f){return [f[0],'transform:translateX('+tx(f[1]).toFixed(1)+'px)']}));
  }

  /* ---------- armies ---------- */
  var cb='';[400,520,640].forEach(function(x,n){
    cb+='<g transform="translate('+x+' 430)"><g class="wad" style="animation-delay:-'+(n*.23)+'s"><use href="#bigBody"/><use class="k" style="animation-name:fa" href="#faceA"/><use class="k" style="animation-name:fb2" href="#faceB" opacity="0"/></g></g>'});
  $('cubesG').innerHTML=cb;
  var mn='';[300,590].forEach(function(x,n){
    mn+='<g transform="translate('+x+' 430) scale(.92)"><g class="bob" style="--dl:-'+(n*.2)+'s"><use href="#minerG"/></g><g class="k" style="animation-name:wflag" opacity="0"><path d="M-20 -68V-150" stroke="#6b3f12" stroke-width="5"/><path d="M-20 -150l40 10-40 18Z" fill="#fff" stroke="#4b5468" stroke-width="3" stroke-linejoin="round"/></g></g>'});
  $('minersG').innerHTML=mn;
  var us='';
  for(i=0;i<8;i++)us+='<g transform="translate('+(1262+i*62)+' 430)"><g class="bob" style="--dl:-'+(rnd()*.45)+'s"><use href="#nodeG"/></g></g>';
  for(i=0;i<6;i++)us+='<g transform="translate('+(1218+i*74)+' 452) scale(1.08)"><g class="bob" style="--dl:-'+(rnd()*.45)+'s"><use href="#nodeG"/></g></g>';
  $('usersG').innerHTML=us;

  /* ---------- flights: cannon blocks bounce off the shield; victory coins fly to the flag ---------- */
  var fl='',sp='',css='',shots=[];
  function flight(d,t0,dur,content,hx,hy,hf){
    var a=t0/D,b=(t0+dur)/D;
    fl+='<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;'+a+';'+(a+.002)+';'+(b-.002)+';'+b+';1" dur="'+D+'s" repeatCount="indefinite"/><animateMotion dur="'+D+'s" repeatCount="indefinite" calcMode="linear" path="'+d+'" keyPoints="0;0;1;1" keyTimes="0;'+a+';'+b+';1"/>'+content+'</g>';
    if(hx!=null)sp+='<g transform="translate('+hx+' '+hy+')"><g class="k fb" style="animation-name:pop;animation-timing-function:ease-out;animation-delay:'+(t0+dur*hf).toFixed(2)+'s;opacity:0"><path d="M0 -34 9 -9 34 0 9 9 0 34-9 9-34 0-9 -9Z" fill="#ffe27a" stroke="#e8973a" stroke-width="4" stroke-linejoin="round"/></g></g>';
  }
  var blk='<g transform="translate(0 20) scale(.3)"><g class="tum"><use href="#bigBody"/><use href="#faceA"/></g></g>';
  for(i=0;i<8;i++){var t0=.8+i*1.5;shots.push(t0);
    flight('M283 356Q700 -30 1120 340Q1170 250 1085 425',t0,2.4,blk,1124,342,.83);
    sp+='<g transform="translate(283 356)"><g class="k fb" style="animation-name:pop;animation-timing-function:ease-out;animation-delay:'+t0+'s;opacity:0"><path d="M0 -22 6 -6 22 0 6 6 0 22-6 6-22 0-6 -6Z" fill="#fff3b8" stroke="#e8973a" stroke-width="3" stroke-linejoin="round"/></g></g>'}
  var coin='<g class="spin"><use href="#coin" x="-20" y="-20" width="40" height="40"/></g>';
  for(i=0;i<6;i++)flight('M930 370Q1300 40 1712 230',14.3+i*.22,2.8,coin,1712,230,1);
  $('flights').innerHTML=fl;$('sparks').innerHTML=sp;

  /* recoil + shield shake on every shot / hit */
  var rc=[[0,'transform:translateX(0)']],sh=[[0,'transform:rotate(0deg)']];
  shots.forEach(function(t){rc.push([t,'transform:translateX(0)'],[t+.06,'transform:translateX(-16px)'],[t+.3,'transform:translateX(0)']);
    var h=t+2.4*.83;sh.push([h,'transform:rotate(0deg)'],[h+.06,'transform:rotate(-8deg)'],[h+.16,'transform:rotate(5deg)'],[h+.3,'transform:rotate(0deg)'])});

  /* ---------- victory confetti + hearts on the stage ---------- */
  var vc='';for(i=0;i<32;i++)vc+='<rect class="cfs" x="'+(300+rnd()*1500)+'" y="-30" width="'+(9+rnd()*7)+'" height="'+(14+rnd()*10)+'" fill="'+cc[i%5]+'" style="--t:'+(2.6+rnd()*2)+'s;--dl:-'+(rnd()*4)+'s"/>';
  for(i=0;i<6;i++)vc+='<g transform="translate('+(1260+i*85)+' 360)"><g class="hup" style="--dl:-'+(i*.45)+'s"><path d="M0 18C-22 2-18 -14-7 -14c5 0 7 3 7 6 0-3 2-6 7-6 11 0 15 16-7 32Z" fill="#ff8fa3" stroke="#c92a2a" stroke-width="3" stroke-linejoin="round"/></g></g>';
  $('vic').innerHTML=vc;

  /* ---------- timeline ---------- */
  css+=
   kf('stg',[[0,'opacity:0'],[.4,'opacity:1'],[23.3,'opacity:1'],[23.9,'opacity:0']])+
   kf('tint',[[0,'opacity:0'],[.6,'opacity:.85'],[12.8,'opacity:.85'],[14.6,'opacity:0']])+
   kf('cloudc',[[0,'fill:#b9b1cf'],[12.8,'fill:#b9b1cf'],[14.6,'fill:#fbf8ec'],[23.2,'fill:#fbf8ec']])+
   kf('sunA',[[0,'opacity:1'],[13.2,'opacity:1'],[14,'opacity:0'],[23.4,'opacity:0'],[23.9,'opacity:1']])+
   kf('sunB',[[0,'opacity:0'],[13.2,'opacity:0'],[14,'opacity:1'],[23.4,'opacity:1'],[23.9,'opacity:0']])+
   kf('fa',[[0,'opacity:1'],[13.2,'opacity:1'],[13.8,'opacity:0']])+
   kf('fb2',[[0,'opacity:0'],[13.2,'opacity:0'],[13.8,'opacity:1']])+
   kf('vicG',[[0,'opacity:0'],[13.6,'opacity:0'],[14.2,'opacity:1'],[23,'opacity:1'],[23.7,'opacity:0']])+
   kf('cubesG',[[0,'transform:translateX(0) scale(1)'],[13.6,'transform:translateX(0) scale(1)'],[15.6,'transform:translateX(-10px) scale(.68)'],[22.6,'transform:translateX(-260px) scale(.68)']])+
   kf('minersG',[[0,'transform:translateX(0)'],[14.4,'transform:translateX(0)'],[15.2,'transform:translateX(30px)'],[22.6,'transform:translateX(840px)']])+
   kf('wflag',[[0,'opacity:0'],[13.8,'opacity:0'],[14.4,'opacity:1']])+
   kf('usersG',[[0,'transform:translateX(0)'],[14,'transform:translateX(0)'],[16,'transform:translateX(-80px)'],[22.6,'transform:translateX(-80px)']])+
   kf('fraise',[[0,'transform:translateY(120px)'],[13.6,'transform:translateY(120px)'],[16,'transform:translateY(0)']])+
   kf('lid',[[0,'transform:rotate(0deg)'],[13.4,'transform:rotate(0deg)'],[14.1,'transform:rotate(-58deg)']])+
   kf('plock',[[0,'opacity:1;transform:none'],[13.4,'opacity:1;transform:none'],[14.3,'opacity:1;transform:translate(-50px,-120px) rotate(-240deg)'],[15.1,'opacity:0;transform:translate(-70px,-60px) rotate(-300deg)']])+
   kf('cgl',[[0,'opacity:0'],[13.6,'opacity:0'],[14.2,'opacity:.9'],[23,'opacity:.9'],[23.7,'opacity:0']])+
   kf('pop',[[0,'opacity:0;transform:scale(.2)'],[.12,'opacity:1;transform:scale(1)'],[.7,'opacity:0;transform:scale(2)']])+
   kf('recoil',rc)+kf('shk',sh);
  $('kf').textContent=css;
  layout();
  var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,150)});
})();
</script>
</body>
</html>
