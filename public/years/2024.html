<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trojan Horse Background</title>
<style>
/* Text-free, happy scene: 2024 - the Wall Street Trojan Horse (spot ETFs wheel Bitcoin inside the walls) and the Fourth Epoch (the fourth halving, shrinking coins). */
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(#cfe8f0 0%,#fdf0c8 55%,#f9d98b 100%)}
.crayon{filter:url(#crayon-filter)}
.abs{position:absolute}
#rays{left:50%;top:46%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(rgba(255,205,90,.26) 0 7deg,transparent 7deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* the savage wooden horse with laser eyes and a top hat */
#sun{left:50%;top:46%;width:min(50vmin,380px);height:min(50vmin,380px);margin:calc(min(50vmin,380px)/-2) 0 0 calc(min(50vmin,380px)/-2);animation:bob 4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(8px) rotate(-2deg)}to{transform:translateY(-12px) rotate(2deg)}}
#sun svg{width:100%;height:100%;display:block}
.beam{width:70vw;height:1.3vmin;min-height:7px;border-radius:6px;background:linear-gradient(90deg,#fff3b8,#ff2d2d 12%,rgba(255,45,45,0));filter:drop-shadow(0 0 8px #ff2d2d);animation:bm .25s steps(2) infinite;animation-delay:var(--d)}
@keyframes bm{50%{opacity:.6;transform:scaleY(.7)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.gl{transform-box:fill-box;transform-origin:center;animation:gl 1.4s ease-in-out infinite alternate}
@keyframes gl{from{transform:scale(.85);opacity:.7}to{transform:scale(1.15);opacity:1}}
.wh{transform-box:fill-box;transform-origin:center;animation:wh 2s linear infinite}
@keyframes wh{to{transform:rotate(360deg)}}
.wag{transform-box:fill-box;transform-origin:100% 0%;animation:wg 1.2s ease-in-out infinite alternate}
@keyframes wg{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.cl{top:var(--y);left:0;animation:cloud var(--t) linear infinite;animation-delay:var(--dl);opacity:.6}
@keyframes cloud{from{transform:translateX(-25vw)}to{transform:translateX(115vw)}}
/* coins puffing out of the horse's belly */
.ht{animation:puff 5s ease-out infinite;animation-delay:var(--dl);opacity:0}
@keyframes puff{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.95}100%{opacity:0;transform:translateY(-24vh) scale(1.1)}}
.zip{left:0;top:var(--y);animation:zip var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes zip{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
.trail{width:60px;height:5px;border-radius:3px;background:linear-gradient(90deg,transparent,#e8973a);margin-right:-6px;opacity:.7}
.row{display:flex;align-items:center}
.fall{top:0;animation:fall var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes fall{from{transform:translateY(-15vh)}to{transform:translateY(112vh)}}
.dot{width:10px;height:10px;border-radius:2px;background:var(--c);opacity:.7}
.fl{top:0;animation:rise var(--t) linear infinite;animation-delay:var(--dl);opacity:.75}
@keyframes rise{from{transform:translateY(110vh)}to{transform:translateY(-30vh)}}
.sw{animation:sway 6s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes sway{from{transform:translateX(-14px) rotate(-10deg)}to{transform:translateX(14px) rotate(10deg)}}
/* the city walls + ground strip + conveyor */
#sky2{left:0;bottom:15%;width:100%;height:22%}
#table{left:0;bottom:0;width:100%;height:15%;border-top:5px solid #2b8a3e;background:repeating-linear-gradient(90deg,rgba(43,138,62,.22) 0 24px,transparent 24px 48px),#fbf3dc}
.track{bottom:2.5%;left:0;display:flex;align-items:center;gap:22px;width:max-content;animation:scroll 90s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
.tw{animation:tws var(--t) ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes tws{from{opacity:.15;transform:scale(.6) rotate(0)}to{opacity:1;transform:scale(1.1) rotate(25deg)}}
svg.i{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="glow"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f0a92e"/></linearGradient>
<symbol id="coin" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="#e8973a" stroke="#222" stroke-width="5"/><circle cx="32" cy="32" r="17" fill="none" stroke="#222" stroke-width="3" opacity=".5"/><path d="M20 22a14 14 0 0 1 9-7" stroke="#fff5cc" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
<symbol id="cube" viewBox="0 0 64 64"><path d="M32 6 56 19 32 32 8 19Z" fill="#c8f0d0" stroke="#2b8a3e" stroke-width="4" stroke-linejoin="round"/><path d="M8 19v26l24 13V32Z" fill="#a8e6b3" stroke="#2b8a3e" stroke-width="4" stroke-linejoin="round"/><path d="M56 19v26L32 58V32Z" fill="#84d494" stroke="#2b8a3e" stroke-width="4" stroke-linejoin="round"/></symbol>
<symbol id="bank" viewBox="0 0 64 64"><path d="M6 24 32 8 58 24Z" fill="#cfd3e0" stroke="#222" stroke-width="4" stroke-linejoin="round"/><g fill="#fbf8ec" stroke="#222" stroke-width="3"><rect x="11" y="27" width="8" height="22"/><rect x="23" y="27" width="8" height="22"/><rect x="35" y="27" width="8" height="22"/><rect x="47" y="27" width="8" height="22"/></g><rect x="6" y="49" width="52" height="8" rx="2" fill="#8f8aa8" stroke="#222" stroke-width="4"/></symbol>
<symbol id="case" viewBox="0 0 64 64"><path d="M24 20V14Q24 10 28 10H36Q40 10 40 14V20" fill="none" stroke="#222" stroke-width="4"/><rect x="6" y="20" width="52" height="34" rx="6" fill="#8a5a2b" stroke="#222" stroke-width="4"/><path d="M6 34H58" stroke="#222" stroke-width="3"/><rect x="27" y="30" width="10" height="9" rx="2" fill="#ffd93b" stroke="#222" stroke-width="3"/></symbol>
<symbol id="hat" viewBox="0 0 64 64"><rect x="18" y="8" width="28" height="36" rx="3" fill="#2a2548" stroke="#222" stroke-width="4"/><rect x="18" y="34" width="28" height="7" fill="#ffd93b" stroke="#222" stroke-width="3"/><rect x="6" y="42" width="52" height="9" rx="4" fill="#2a2548" stroke="#222" stroke-width="4"/></symbol>
<symbol id="up" viewBox="0 0 64 64"><path d="M6 8V56H58" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 46 24 34 32 40 44 22 52 14" fill="none" stroke="#2b8a3e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 12 54 12 54 24" fill="none" stroke="#2b8a3e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="stair" viewBox="0 0 128 64"><g stroke="#222" stroke-width="4" fill="#e8973a"><circle cx="28" cy="34" r="24"/><circle cx="70" cy="40" r="18"/><circle cx="98" cy="46" r="12"/><circle cx="116" cy="52" r="7"/></g><g fill="none" stroke="#fff5cc" stroke-width="3" stroke-linecap="round"><path d="M14 24a16 16 0 0 1 10-8"/><path d="M60 34a10 10 0 0 1 6-4"/></g></symbol>
<symbol id="horse" viewBox="0 0 64 64"><rect x="8" y="48" width="48" height="6" rx="2" fill="#b8803f" stroke="#222" stroke-width="3"/><circle cx="18" cy="58" r="5" fill="#8a5a2b" stroke="#222" stroke-width="2.5"/><circle cx="46" cy="58" r="5" fill="#8a5a2b" stroke="#222" stroke-width="2.5"/><g fill="#d9a35f" stroke="#222" stroke-width="3"><rect x="12" y="38" width="7" height="10"/><rect x="22" y="38" width="7" height="10"/><rect x="36" y="38" width="7" height="10"/><rect x="46" y="38" width="7" height="10"/></g><rect x="8" y="22" width="46" height="20" rx="8" fill="#e8b86a" stroke="#222" stroke-width="3.5"/><path d="M42 24 46 8 56 10 54 28Z" fill="#e8b86a" stroke="#222" stroke-width="3" stroke-linejoin="round"/><rect x="46" y="4" width="16" height="11" rx="5" fill="#e8b86a" stroke="#222" stroke-width="3"/><circle cx="55" cy="8" r="1.8" fill="#222"/><rect x="26" y="28" width="12" height="9" rx="2" fill="#4c4180" stroke="#222" stroke-width="2"/><circle cx="32" cy="32" r="3" fill="#ffd93b"/></symbol>
<symbol id="cloud" viewBox="0 0 96 48"><path d="M14 42a12 12 0 0 1-2-24 18 18 0 0 1 34-6 16 16 0 0 1 28 10 11 11 0 0 1-2 20Z" fill="#fbf8ec" stroke="#222" stroke-width="3.5" stroke-linejoin="round" opacity=".9"/></symbol>
<symbol id="sparkle" viewBox="0 0 64 64"><path d="M32 6 38 26 58 32 38 38 32 58 26 38 6 32 26 26Z" fill="#fff3b8" stroke="#e8973a" stroke-width="3" stroke-linejoin="round"/></symbol>
</defs></svg>

<div id="rays" class="abs" aria-hidden="true"></div>
<div id="sky" aria-hidden="true"></div>
<svg id="sky2" class="abs crayon" viewBox="0 0 1000 120" preserveAspectRatio="none" aria-hidden="true"></svg>

<!-- savage Trojan horse: laser eyes, snarl with fangs, spiked collar, flame mane, spiked wheels, claw scars, glowing Bitcoin hatch, IV on the flank -->
<div id="sun" class="abs" aria-hidden="true">
<div class="abs beam" style="left:97%;top:18.4%;--d:0s"></div>
<div class="abs beam" style="left:97%;top:21%;--d:-.15s"></div>
<svg class="crayon" viewBox="0 -24 200 230">
  <rect x="16" y="158" width="168" height="12" rx="4" fill="#b8803f" stroke="#222" stroke-width="5"/>
  <path d="M60.7 181.3 L73.0 184.0 L60.7 186.7 Z M58.9 191.1 L65.7 201.7 L55.1 194.9 Z M50.7 196.7 L48.0 209.0 L45.3 196.7 Z M40.9 194.9 L30.3 201.7 L37.1 191.1 Z M35.3 186.7 L23.0 184.0 L35.3 181.3 Z M37.1 176.9 L30.3 166.3 L40.9 173.1 Z M45.3 171.3 L48.0 159.0 L50.7 171.3 Z M55.1 173.1 L65.7 166.3 L58.9 176.9 Z M164.7 181.3 L177.0 184.0 L164.7 186.7 Z M162.9 191.1 L169.7 201.7 L159.1 194.9 Z M154.7 196.7 L152.0 209.0 L149.3 196.7 Z M144.9 194.9 L134.3 201.7 L141.1 191.1 Z M139.3 186.7 L127.0 184.0 L139.3 181.3 Z M141.1 176.9 L134.3 166.3 L144.9 173.1 Z M149.3 171.3 L152.0 159.0 L154.7 171.3 Z M159.1 173.1 L169.7 166.3 L162.9 176.9 Z " fill="#9aa0b4" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#222" stroke-width="5" fill="#8a5a2b"><circle cx="48" cy="184" r="14"/><circle cx="152" cy="184" r="14"/></g>
  <g class="wh"><path d="M48 172V196M36 184H60" stroke="#222" stroke-width="4"/></g><g class="wh"><path d="M152 172V196M140 184H164" stroke="#222" stroke-width="4"/></g>
  <!-- flaming tail -->
  <g class="wag"><path d="M26 84C4 76-8 100 4 122 8 132 14 138 10 152 28 138 34 114 30 96Z" fill="#ff4d2e" stroke="#222" stroke-width="5" stroke-linejoin="round"/><path d="M14 98C10 110 18 120 16 134" fill="none" stroke="#ffd93b" stroke-width="5" stroke-linecap="round"/></g>
  <g fill="#d9a35f" stroke="#222" stroke-width="5"><rect x="34" y="118" width="20" height="42"/><rect x="62" y="118" width="20" height="42"/><rect x="118" y="118" width="20" height="42"/><rect x="146" y="118" width="20" height="42"/></g>
  <g fill="#6b6f85" stroke="#222" stroke-width="4"><rect x="32" y="152" width="24" height="9" rx="3"/><rect x="60" y="152" width="24" height="9" rx="3"/><rect x="116" y="152" width="24" height="9" rx="3"/><rect x="144" y="152" width="24" height="9" rx="3"/></g>
  <path d="M124 90 144 30 178 38 168 92Z" fill="#e8b86a" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
  <rect x="22" y="70" width="140" height="62" rx="26" fill="#e8b86a" stroke="#222" stroke-width="6"/>
  <path d="M60 76V126M118 76V126M140 80V122" stroke="#8a5a2b" stroke-width="3" opacity=".35"/>
  <!-- claw scars -->
  <path d="M128 78 142 112M138 76 152 110M148 74 160 104" stroke="#c1121f" stroke-width="5" stroke-linecap="round"/>
  <path d="M30 98 52 94M32 106 50 104" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <!-- flame mane -->
  <path d="M146 20 120 20 134 34 110 40 128 52 104 62 126 70 106 86 130 90 144 36Z" fill="#ff4d2e" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
  <path d="M136 36 120 42M132 56 116 64" stroke="#ffd93b" stroke-width="5" stroke-linecap="round"/>
  <!-- head -->
  <rect x="142" y="6" width="56" height="42" rx="18" fill="#e8b86a" stroke="#222" stroke-width="6"/>
  <path d="M152 44 162 30" stroke="#c1121f" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="193" cy="33" r="2.8" fill="#222"/>
  <!-- angry laser-eye shades -->
  <path d="M142 20 150 18" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <rect x="150" y="14" width="22" height="15" rx="6" fill="#ff2d2d" stroke="#111" stroke-width="4"/>
  <rect x="175" y="14" width="22" height="15" rx="6" fill="#ff2d2d" stroke="#111" stroke-width="4"/>
  <path d="M172 19H175" stroke="#111" stroke-width="5"/>
  <g class="gl"><circle cx="161" cy="21" r="5" fill="#fff3b8"/><circle cx="186" cy="21" r="5" fill="#fff3b8"/></g>
  <path d="M146 9 173 17M200 9 177 17" stroke="#111" stroke-width="6" stroke-linecap="round"/>
  <!-- snarl with fangs -->
  <path d="M160 39Q179 33 196 39L193 47Q178 55 163 47Z" fill="#8f0f1f" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <path d="M166 38 169 47 172 36M184 36 187 46 190 37" fill="#fff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- spiked collar -->
  <path d="M134 66Q158 88 180 66" fill="none" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <path d="M138 70 134 58 146 66ZM148 78 146 64 158 74ZM160 82 160 68 170 78ZM172 78 174 64 184 72Z" fill="#c9cde0" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <!-- tilted battered top hat -->
  <g transform="translate(168 6) rotate(-14)"><rect x="-13" y="-32" width="26" height="30" rx="3" fill="#2a2548" stroke="#222" stroke-width="4"/><rect x="-13" y="-14" width="26" height="7" fill="#c1121f" stroke="#222" stroke-width="2.5"/><rect x="-25" y="-4" width="50" height="8" rx="4" fill="#2a2548" stroke="#222" stroke-width="4"/></g>
  <!-- belly hatch -->
  <path d="M74 88 52 98V130L74 124Z" fill="#c99a5e" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <rect x="72" y="88" width="48" height="40" rx="6" fill="#4c4180" stroke="#222" stroke-width="5"/>
  <g class="gl"><circle cx="96" cy="108" r="34" fill="url(#glow)"/></g>
  <circle cx="96" cy="108" r="15" fill="url(#gold)" stroke="#8a5a00" stroke-width="4"/>
  <text x="96" y="115" text-anchor="middle" font-size="20" font-weight="900" fill="#7a4a00" font-family="Arial,sans-serif">&#8383;</text>
  <g transform="translate(44 100)"><circle r="17" fill="#fbf8ec" stroke="#222" stroke-width="4.5"/><text y="6" text-anchor="middle" font-size="17" font-weight="900" fill="#d9536a" font-family="Arial,sans-serif">IV</text></g>
</svg>
</div>

<div id="front" aria-hidden="true"></div>
<div id="table" class="abs crayon" aria-hidden="true"></div>
<div id="track" aria-hidden="true"></div>

<svg style="display:none" aria-hidden="true">
  <filter id="crayon-filter">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script>
(function(){
  var sky='',fr='',i,s,u=function(n,w){return '<svg class="i crayon" width="'+w+'" height="'+w+'"><use href="#'+n+'"/></svg>'};
  /* clouds + twinkles */
  for(i=0;i<3;i++)sky+='<div class="abs cl" style="--y:'+(5+i*11)+'%;--t:'+(90+i*25)+'s;--dl:-'+(i*38)+'s"><svg class="i crayon" width="'+(110+(i*37)%70)+'" height="'+(55+(i*19)%35)+'" viewBox="0 0 96 48"><use href="#cloud"/></svg></div>';
  for(i=0;i<6;i++)sky+='<div class="abs tw" style="left:'+(4+(i*29)%92)+'%;top:'+(4+(i*23)%40)+'%;--t:'+(2+(i%4)*.9)+'s;--dl:-'+(i*.7)+'s">'+u('sparkle',16+(i%3)*8)+'</div>';
  document.getElementById('sky').innerHTML=sky;
  /* the Wall Street skyline behind the walls */
  var b='',x=0,h;
  while(x<1000){var w=40+(x*7)%38;h=40+((x*13)%64);
    b+='<rect x="'+x+'" y="'+(120-h)+'" width="'+w+'" height="'+h+'" fill="'+(x%3?'#d6e4f2':'#c3d6ea')+'" stroke="#5b7fa8" stroke-width="3" vector-effect="non-scaling-stroke"/>';x+=w+4}
  document.getElementById('sky2').innerHTML=b;
  /* coins puffing out of the horse */
  [-14,0,14].forEach(function(o,k){fr+='<div class="abs ht" style="left:calc(50% + '+(o*1.4)+'vmin);top:42%;--dl:-'+(k*1.7)+'s">'+u(k==1?'cube':'coin',30)+'</div>'});
  /* coins hopping across */
  for(i=0;i<4;i++)fr+='<div class="abs zip" style="--y:'+(14+i*11)+'%;--t:'+(5+(i*.9)%3)+'s;--dl:-'+(i*1.5)+'s"><div class="row"><div class="trail"></div>'+u('coin',30)+'</div></div>';
  /* confetti */
  var cc=['#d9536a','#f5c542','#2b8a3e','#5aa9e6'];
  for(i=0;i<8;i++)fr+='<div class="abs fall dot" style="left:'+(4+i*12.5)+'%;--c:'+cc[i%4]+';--t:'+(24+(i*3)%10)+'s;--dl:-'+(i*3)+'s"></div>';
  /* floating: bank, briefcase, top hat, chart up, the shrinking-coins staircase, a mini horse, a block */
  var n=['bank','case','stair','up','hat','horse','cube'];
  for(i=0;i<n.length;i++){s=n[i]=='stair'?96:56+(i*17)%30;
    fr+='<div class="abs fl" style="left:'+(4+i*14)+'%;--t:'+(44+(i*7)%16)+'s;--dl:-'+(i*6.1)+'s"><div class="sw">'+(n[i]=='stair'?'<svg class="i crayon" width="96" height="48" viewBox="0 0 128 64"><use href="#stair"/></svg>':u(n[i],s))+'</div></div>'}
  document.getElementById('front').innerHTML=fr;
  /* conveyor on the ground */
  var seq=['horse','coin','bank','case','stair','up'],t='';
  for(i=0;i<12;i++)t+=seq[i%6]=='stair'?'<svg class="i crayon" width="66" height="33" viewBox="0 0 128 64"><use href="#stair"/></svg>':u(seq[i%6],44);
  document.getElementById('track').innerHTML='<div class="abs track">'+t+t+'</div>';
})();
</script>
</body>
</html>
