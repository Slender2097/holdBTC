<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Street Spot ETF Background</title>
<style>
/* Text-free, happy scene: Wall Street gives in and files for a spot Bitcoin ETF (2023). */
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(#c9d8f5 0%,#fdf0c8 55%,#f9d98b 100%)}
.crayon{filter:url(#crayon-filter)}
.abs{position:absolute}
#rays{left:50%;top:42%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(rgba(255,205,90,.26) 0 7deg,transparent 7deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* the happy top-hat coin */
#sun{left:50%;top:44%;width:min(42vmin,330px);height:min(42vmin,330px);margin:calc(min(42vmin,330px)/-2) 0 0 calc(min(42vmin,330px)/-2);animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(8px) rotate(-5deg)}to{transform:translateY(-12px) rotate(5deg)}}
#sun svg{width:100%;height:100%;display:block;overflow:visible}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.cl{top:var(--y);left:0;animation:cloud var(--t) linear infinite;animation-delay:var(--dl);opacity:.6}
@keyframes cloud{from{transform:translateX(-25vw)}to{transform:translateX(115vw)}}
/* green arrows puffing up from the coin */
.ht{animation:heart 6s ease-out infinite;animation-delay:var(--dl);opacity:0}
@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.9}100%{opacity:0;transform:translateY(-20vh) scale(1.1)}}
/* falling coins + ticker tape */
.fall{top:0;animation:fall var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes fall{from{transform:translateY(-15vh)}to{transform:translateY(112vh)}}
.tape{width:7px;height:26px;border-radius:2px;background:var(--c);opacity:.75;animation:fall var(--t) linear infinite,flip 2.4s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes flip{from{rotate:-25deg}to{rotate:25deg}}
.fl{top:0;animation:rise var(--t) linear infinite;animation-delay:var(--dl);opacity:.75}
@keyframes rise{from{transform:translateY(110vh)}to{transform:translateY(-30vh)}}
.sw{animation:sway 6s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes sway{from{transform:translateX(-14px) rotate(-10deg)}to{transform:translateX(14px) rotate(10deg)}}
/* skyline */
#city{left:0;bottom:14%;width:100%;height:34%}
.lit{animation:lit 3s steps(2) infinite alternate;animation-delay:var(--dl)}
@keyframes lit{from{opacity:.45}to{opacity:1}}
/* dark green ground with ticker stripes + conveyor */
#table{left:0;bottom:0;width:100%;height:15%;border-top:5px solid #1f6b3a;background:repeating-linear-gradient(90deg,rgba(43,138,62,.35) 0 24px,transparent 24px 48px),#e6f3e0}
.track{bottom:2.5%;left:0;display:flex;align-items:center;gap:22px;width:max-content;animation:scroll 90s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
svg.i{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="coin" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="#e8973a" stroke="#222" stroke-width="5"/><circle cx="32" cy="32" r="17" fill="none" stroke="#222" stroke-width="3" opacity=".5"/><path d="M20 22a14 14 0 0 1 9-7" stroke="#fff5cc" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
<symbol id="hat" viewBox="0 0 64 64"><rect x="18" y="8" width="28" height="36" rx="3" fill="#2b2350" stroke="#0f0b26" stroke-width="4"/><rect x="18" y="32" width="28" height="7" fill="#d9536a"/><rect x="6" y="42" width="52" height="10" rx="5" fill="#2b2350" stroke="#0f0b26" stroke-width="4"/></symbol>
<symbol id="brief" viewBox="0 0 64 64"><path d="M24 20v-6a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v6" fill="none" stroke="#5a3a18" stroke-width="4"/><rect x="6" y="20" width="52" height="34" rx="5" fill="#c99a5e" stroke="#5a3a18" stroke-width="4"/><path d="M6 34h52" stroke="#5a3a18" stroke-width="3"/><rect x="27" y="30" width="10" height="9" rx="2" fill="#ffd45a" stroke="#5a3a18" stroke-width="2.5"/></symbol>
<symbol id="doc" viewBox="0 0 64 64"><rect x="14" y="6" width="36" height="52" rx="3" fill="#f4f1e2" stroke="#222" stroke-width="4"/><path d="M22 18h20M22 26h20" stroke="#222" stroke-width="3" opacity=".5" stroke-linecap="round"/><circle cx="38" cy="43" r="9" fill="#d9536a" opacity=".85" stroke="#a3243a" stroke-width="2.5"/><path d="M33 43l4 4 7-8" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="up" viewBox="0 0 64 64"><path d="M6 54 24 34l10 10 24-28" fill="none" stroke="#2b8a3e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 14h16v16" fill="none" stroke="#2b8a3e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="sparkle" viewBox="0 0 64 64"><path d="M32 6 38 26 58 32 38 38 32 58 26 38 6 32 26 26Z" fill="#fff3b8" stroke="#e8973a" stroke-width="3" stroke-linejoin="round"/></symbol>
<symbol id="cloud" viewBox="0 0 96 48"><path d="M14 42a12 12 0 0 1-2-24 18 18 0 0 1 34-6 16 16 0 0 1 28 10 11 11 0 0 1-2 20Z" fill="#fbf8ec" stroke="#222" stroke-width="3.5" stroke-linejoin="round" opacity=".9"/></symbol>
</defs></svg>

<div id="rays" class="abs" aria-hidden="true"></div>
<div id="sky" aria-hidden="true"></div>

<!-- Wall Street skyline -->
<svg id="city" class="abs crayon" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
  <defs><pattern id="win" width="22" height="26" patternUnits="userSpaceOnUse"><rect x="6" y="6" width="9" height="12" rx="1" fill="#ffe08a"/></pattern></defs>
  <g fill="#a89bd4" stroke="#3d3660" stroke-width="4" stroke-linejoin="round">
    <rect x="20" y="130" width="110" height="170" vector-effect="non-scaling-stroke"/>
    <path d="M150 300V90h90v210Z M195 90V50" vector-effect="non-scaling-stroke"/>
    <rect x="260" y="160" width="100" height="140" vector-effect="non-scaling-stroke"/>
    <path d="M620 300V150h90v150Z M740 300V80h100v220Z M790 80V36" vector-effect="non-scaling-stroke"/>
    <rect x="860" y="140" width="120" height="160" vector-effect="non-scaling-stroke"/>
    <rect x="380" y="200" width="220" height="100" fill="#cfc9ea" vector-effect="non-scaling-stroke"/>
  </g>
  <g fill="url(#win)" class="lit" style="--dl:0s"><rect x="20" y="130" width="110" height="170"/><rect x="150" y="90" width="90" height="210"/><rect x="620" y="150" width="90" height="150"/></g>
  <g fill="url(#win)" class="lit" style="--dl:-1.5s"><rect x="260" y="160" width="100" height="140"/><rect x="740" y="80" width="100" height="220"/><rect x="860" y="140" width="120" height="160"/></g>
  <path d="M380 200 490 170 600 200M410 200V300M470 200V300M530 200V300M590 200V300" fill="none" stroke="#3d3660" stroke-width="4" vector-effect="non-scaling-stroke"/>
</svg>

<!-- big smiling coin in a top hat -->
<div id="sun" class="abs" aria-hidden="true">
<svg class="crayon" viewBox="0 0 200 200">
  <circle cx="100" cy="112" r="82" fill="#e8973a" stroke="#222" stroke-width="7"/>
  <circle cx="100" cy="112" r="64" fill="#ffd76a" stroke="#b8651b" stroke-width="4"/>
  <path d="M56 76a58 58 0 0 1 32-22" stroke="#fff5cc" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g fill="#222"><circle class="eye" cx="78" cy="106" r="8"/><circle class="eye" cx="122" cy="106" r="8"/></g>
  <circle cx="63" cy="124" r="9" fill="#ff8fa3" opacity=".55"/><circle cx="137" cy="124" r="9" fill="#ff8fa3" opacity=".55"/>
  <path d="M74 128Q100 164 126 128Z" fill="#a3243a" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="100" cy="148" rx="11" ry="7" fill="#ff8fa3"/>
  <rect x="62" y="-22" width="76" height="70" rx="6" fill="#2b2350" stroke="#0f0b26" stroke-width="6"/>
  <rect x="62" y="22" width="76" height="14" fill="#d9536a"/>
  <rect x="38" y="42" width="124" height="18" rx="9" fill="#2b2350" stroke="#0f0b26" stroke-width="6"/>
</svg>
</div>

<div id="front" aria-hidden="true"></div>
<div id="table" class="abs crayon" aria-hidden="true"></div>
<div id="track" aria-hidden="true"></div>

<svg style="display:none" aria-hidden="true">
  <filter id="crayon-filter">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script>
(function(){
  var sky='',fr='',i,s,u=function(n,w){return '<svg class="i crayon" width="'+w+'" height="'+w+'"><use href="#'+n+'"/></svg>'};
  /* clouds */
  for(i=0;i<3;i++)sky+='<div class="abs cl" style="--y:'+(5+i*11)+'%;--t:'+(90+i*25)+'s;--dl:-'+(i*38)+'s"><svg class="i crayon" width="'+(110+(i*37)%70)+'" height="'+(55+(i*19)%35)+'" viewBox="0 0 96 48"><use href="#cloud"/></svg></div>';
  document.getElementById('sky').innerHTML=sky;
  /* green arrows puffing up from the coin */
  [-14,0,14].forEach(function(o,k){fr+='<div class="abs ht" style="left:calc(50% + '+(o*1.6)+'vmin);top:18%;--dl:-'+(k*2)+'s">'+u('up',30)+'</div>'});
  /* coins raining down */
  for(i=0;i<5;i++)fr+='<div class="abs fall" style="left:'+(8+i*20)+'%;--t:'+(16+(i*5)%9)+'s;--dl:-'+(i*4.2)+'s"><div class="sw">'+u('coin',34)+'</div></div>';
  /* ticker tape */
  var cc=['#2b8a3e','#fff','#f5c542','#84d494'];
  for(i=0;i<10;i++)fr+='<div class="abs tape" style="left:'+(3+i*10)+'%;--c:'+cc[i%4]+';--t:'+(20+(i*3)%10)+'s;--dl:-'+(i*2.7)+'s"></div>';
  /* floating Wall Street stuff */
  var n=['doc','hat','brief','up'];
  for(i=0;i<n.length;i++){s=56+(i*17)%30;
    fr+='<div class="abs fl" style="left:'+(10+i*24)+'%;--t:'+(44+(i*7)%16)+'s;--dl:-'+(i*5.3)+'s"><div class="sw">'+u(n[i],s)+'</div></div>'}
  document.getElementById('front').innerHTML=fr;
  /* conveyor on the ground */
  var seq=['brief','coin','doc','hat','up','coin'],t='';
  for(i=0;i<12;i++)t+=u(seq[i%6],44);
  document.getElementById('track').innerHTML='<div class="abs track">'+t+t+'</div>';
})();
</script>
</body>
</html>
