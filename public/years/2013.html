<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12 Words</title>
<style>
/* Text-free 12s loop: a person stands still while twelve words fly into their head; a golden coin lives there now and the glow grows with every word. */
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(#b3a9e6 0%,#dcbfe0 35%,#f5c6b0 68%,#f8dd9c 100%)}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.mote{position:absolute;bottom:-20px;left:var(--x);width:var(--s);height:var(--s);background:#ffd45a;opacity:.4;border-radius:2px;animation:mote var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes mote{from{transform:translateY(0) rotate(0)}to{transform:translateY(-112vh) rotate(200deg)}}
.st{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);background:#fff6cf;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw var(--t) ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes tw{from{opacity:.15;transform:scale(.6)}to{opacity:.9;transform:scale(1.1)}}
#stage{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.k{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.fb{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.k{opacity:1!important}}
</style>
<style id="kf"></style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<svg id="stage" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
<defs>
  <filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
  <radialGradient id="glow"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f0a92e"/></linearGradient>
  <symbol id="coin" viewBox="-20 -20 40 40"><circle r="18" fill="url(#gold)" stroke="#8a5a00" stroke-width="3.5"/><circle r="12" fill="none" stroke="#8a5a00" stroke-width="2" opacity=".55"/><text y="7" text-anchor="middle" font-size="20" font-weight="900" fill="#7a4a00" font-family="Arial,sans-serif">₿</text><path d="M-11 -8a13 13 0 0 1 8-7" stroke="#fff6cf" stroke-width="3" fill="none" stroke-linecap="round"/></symbol>
</defs>

<path d="M-100 470 50 340 200 430 340 310 500 440 660 340 800 440 940 320 1100 470Z" fill="#a89bd4" opacity=".7"/>
<g filter="url(#crayon)"><rect x="-50" y="470" width="1100" height="120" fill="#7f70b8" stroke="#5b4d96" stroke-width="6"/></g>
<path d="M-50 520H1050" stroke="#c9bdf0" stroke-width="5" stroke-dasharray="70 60" opacity=".6"/>

<!-- the person -->
<g transform="translate(500 505) scale(1.5)"><g class="k" style="animation-name:fig" opacity="0">
  <g class="k fb" style="animation-name:hg" opacity="0"><circle cy="-165" r="90" fill="url(#glow)"/></g>
  <g class="bob">
    <path d="M-10 -62V0M10 -62V0" stroke="#241d4a" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M-30 -112 -35 -66M30 -112 35 -66" stroke="#241d4a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M-32 -68Q-32 -128 0 -130Q32 -128 32 -68Z" fill="#241d4a" stroke="#0f0b26" stroke-width="5" stroke-linejoin="round"/>
    <path d="M28 -120 32 -68" stroke="#ffb84a" stroke-width="5" stroke-linecap="round"/>
    <circle cy="-165" r="34" fill="#241d4a" stroke="#0f0b26" stroke-width="5"/><path d="M14 -194A34 34 0 0 1 32 -170" fill="none" stroke="#ffb84a" stroke-width="4" stroke-linecap="round"/>
    <g class="k fb" style="animation-name:hc"><use href="#coin" x="-17" y="-182" width="34" height="34"/></g>
  </g>
</g></g>

<!-- the twelve words -->
<g id="tags" transform="translate(500 257)"></g>
</svg>

<script>
(function(){
  var D=12,i,$=function(id){return document.getElementById(id)};
  function pc(s){return (s/D*100).toFixed(3)+'%'}
  function kf(n,st){var l=st[st.length-1];if(l[0]<D)st=st.concat([[D,l[1]]]);return '@keyframes '+n+'{'+st.map(function(x){return pc(x[0])+'{'+x[1]+'}'}).join('')+'}'}
  var seed=3;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  var sk='';
  for(i=0;i<16;i++)sk+='<div class="st" style="--x:'+(rnd()*96)+'%;--y:'+(rnd()*45)+'%;--s:'+(8+rnd()*12)+'px;--t:'+(2+rnd()*3)+'s;--dl:-'+(rnd()*4)+'s"></div>';
  for(i=0;i<14;i++)sk+='<div class="mote" style="--x:'+(rnd()*98)+'%;--s:'+(5+rnd()*6)+'px;--t:'+(22+rnd()*20)+'s;--dl:-'+(rnd()*40)+'s"></div>';
  $('sky').innerHTML=sk;

  /* coin + glow grow a little with every word that arrives */
  var hc=[[0,'transform:scale(.7)'],[1.2,'transform:scale(.7)']],hg=[[0,'opacity:0;transform:scale(.5)'],[1.2,'opacity:0;transform:scale(.5)']],t,s;
  for(i=0;i<12;i++){t=2.8+i*.4;s=.7+i*.04;
    hc.push([t,'transform:scale('+(s+.3).toFixed(2)+')'],[t+.25,'transform:scale('+(s+.04).toFixed(2)+')']);
    hg.push([t,'opacity:'+(.35+i*.05).toFixed(2)+';transform:scale('+(.6+i*.06).toFixed(2)+')'])}
  hc.push([7.8,'transform:scale(1.8)'],[8.5,'transform:scale(1.25)'],[11,'transform:scale(1.25)']);
  hg.push([7.8,'opacity:1;transform:scale(2.3)'],[9,'opacity:.9;transform:scale(1.9)'],[11,'opacity:.9;transform:scale(1.9)'],[11.7,'opacity:0;transform:scale(1.9)']);

  var css=
   kf('fig',[[0,'opacity:0'],[.8,'opacity:1'],[11,'opacity:1'],[11.7,'opacity:0']])+kf('hc',hc)+kf('hg',hg)+
   kf('tg',[[0,'opacity:0;transform:translate(var(--sx),var(--sy)) scale(.9)'],[.25,'opacity:1'],[1.5,'opacity:1;transform:translate(0,0) scale(.6)'],[1.8,'opacity:0;transform:translate(0,0) scale(.15)']]);

  var pal=['#ff8fa3','#ffd45a','#84d494','#5aa9e6','#c9a2ff','#ffb84a'],tg='';
  for(i=0;i<12;i++){var a=-Math.PI*(.06+.88*i/11);
    tg+='<g class="k" style="animation-name:tg;animation-delay:'+(1.2+i*.4).toFixed(2)+'s;--sx:'+(Math.cos(a)*330).toFixed(0)+'px;--sy:'+(Math.sin(a)*200).toFixed(0)+'px;opacity:0"><g transform="scale(1.5)"><rect x="-22" y="-11" width="44" height="22" rx="7" fill="'+pal[i%6]+'" stroke="#231d3d" stroke-width="3"/><path d="M-12 0H12" stroke="#231d3d" stroke-width="3" stroke-linecap="round" opacity=".5"/></g></g>'}
  $('tags').innerHTML=tg;
  $('kf').textContent=css;
})();
</script>
</body>
</html>
