<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza Day Background</title>
<style>
/* Text-free, happy scene: Bitcoin Pizza Day (10,000 BTC for two pizzas). */
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(#cfe8f0 0%,#fdf0c8 55%,#f9d98b 100%)}
.crayon{filter:url(#crayon-filter)}
.abs{position:absolute}
#rays{left:50%;top:46%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(rgba(255,205,90,.26) 0 7deg,transparent 7deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* the happy pizza sun */
#sun{left:50%;top:46%;width:min(40vmin,320px);height:min(40vmin,320px);margin:calc(min(40vmin,320px)/-2) 0 0 calc(min(40vmin,320px)/-2);animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(8px) rotate(-5deg)}to{transform:translateY(-12px) rotate(5deg)}}
#sun svg{width:100%;height:100%;display:block}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.cl{top:var(--y);left:0;animation:cloud var(--t) linear infinite;animation-delay:var(--dl);opacity:.6}
@keyframes cloud{from{transform:translateX(-25vw)}to{transform:translateX(115vw)}}
/* hearts puffing out of the pizza */
.ht{animation:heart 6s ease-out infinite;animation-delay:var(--dl);opacity:0}
@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.85}100%{opacity:0;transform:translateY(-20vh) scale(1.1)}}
/* falling coins + confetti */
.fall{top:0;animation:fall var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes fall{from{transform:translateY(-15vh)}to{transform:translateY(112vh)}}
.dot{width:10px;height:10px;border-radius:2px;background:var(--c);opacity:.7}
/* floating pizza stuff */
.fl{top:0;animation:rise var(--t) linear infinite;animation-delay:var(--dl);opacity:.7}
@keyframes rise{from{transform:translateY(110vh)}to{transform:translateY(-30vh)}}
.sw{animation:sway 6s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes sway{from{transform:translateX(-14px) rotate(-10deg)}to{transform:translateX(14px) rotate(10deg)}}
/* tablecloth + conveyor of pizza things */
#table{left:0;bottom:0;width:100%;height:15%;border-top:5px solid #d9536a;background:repeating-linear-gradient(0deg,rgba(217,83,106,.32) 0 24px,transparent 24px 48px),repeating-linear-gradient(90deg,rgba(217,83,106,.32) 0 24px,transparent 24px 48px),#fbf3dc}
.track{bottom:2.5%;left:0;display:flex;align-items:center;gap:22px;width:max-content;animation:scroll 90s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
svg.i{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="coin" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="#e8973a" stroke="#222" stroke-width="5"/><circle cx="32" cy="32" r="17" fill="none" stroke="#222" stroke-width="3" opacity=".5"/><path d="M20 22a14 14 0 0 1 9-7" stroke="#fff5cc" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
<symbol id="pizza" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="#f2b45a" stroke="#b8651b" stroke-width="5"/><circle cx="32" cy="32" r="21" fill="#ffd76a"/><g fill="#d9536a" stroke="#a3243a" stroke-width="2.5"><circle cx="22" cy="25" r="5"/><circle cx="40" cy="22" r="5"/><circle cx="42" cy="39" r="5"/><circle cx="25" cy="42" r="5"/></g></symbol>
<symbol id="slice" viewBox="0 0 64 64"><path d="M32 58 8 16Q32 2 56 16Z" fill="#ffd76a" stroke="#b8651b" stroke-width="4" stroke-linejoin="round"/><path d="M9 16Q32 3 55 16" fill="none" stroke="#f2b45a" stroke-width="7" stroke-linecap="round"/><g fill="#d9536a" stroke="#a3243a" stroke-width="2.5"><circle cx="24" cy="28" r="5"/><circle cx="39" cy="26" r="5"/><circle cx="32" cy="42" r="4.5"/></g></symbol>
<symbol id="cslice" viewBox="0 0 64 64"><path d="M32 58 8 16Q32 2 56 16Z" fill="#ffd76a" stroke="#b8651b" stroke-width="4" stroke-linejoin="round"/><path d="M9 16Q32 3 55 16" fill="none" stroke="#f2b45a" stroke-width="7" stroke-linecap="round"/><g fill="#e8973a" stroke="#222" stroke-width="2.5"><circle cx="24" cy="28" r="5.5"/><circle cx="39" cy="26" r="5.5"/><circle cx="32" cy="42" r="5"/></g></symbol>
<symbol id="box" viewBox="0 0 64 64"><rect x="6" y="12" width="52" height="44" rx="4" fill="#e8c58f" stroke="#8a5a2b" stroke-width="4"/><rect x="12" y="18" width="40" height="32" rx="3" fill="#c99a5e" opacity=".4"/><circle cx="32" cy="34" r="13" fill="#ffd76a" stroke="#b8651b" stroke-width="3"/><g fill="#d9536a"><circle cx="27" cy="30" r="3"/><circle cx="37" cy="32" r="3"/><circle cx="31" cy="40" r="3"/></g></symbol>
<symbol id="heart" viewBox="0 0 64 64"><path d="M32 54C8 36 12 14 26 14c5 0 6 3 6 6 0-3 1-6 6-6 14 0 18 22-6 40Z" fill="#ff8fa3" stroke="#c92a2a" stroke-width="3" stroke-linejoin="round"/></symbol>
<symbol id="cloud" viewBox="0 0 96 48"><path d="M14 42a12 12 0 0 1-2-24 18 18 0 0 1 34-6 16 16 0 0 1 28 10 11 11 0 0 1-2 20Z" fill="#fbf8ec" stroke="#222" stroke-width="3.5" stroke-linejoin="round" opacity=".9"/></symbol>
</defs></svg>

<div id="rays" class="abs" aria-hidden="true"></div>
<div id="sky" aria-hidden="true"></div>

<!-- big smiling pizza -->
<div id="sun" class="abs" aria-hidden="true">
<svg class="crayon" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="92" fill="#f2b45a" stroke="#b8651b" stroke-width="7"/>
  <circle cx="100" cy="100" r="74" fill="#ffd76a"/>
  <g fill="#d9536a" stroke="#a3243a" stroke-width="3.5"><circle cx="55" cy="58" r="13"/><circle cx="148" cy="55" r="13"/><circle cx="152" cy="142" r="13"/><circle cx="48" cy="140" r="13"/></g>
  <g fill="#222"><circle class="eye" cx="76" cy="90" r="9"/><circle class="eye" cx="124" cy="90" r="9"/></g>
  <circle cx="60" cy="112" r="10" fill="#ff8fa3" opacity=".55"/><circle cx="140" cy="112" r="10" fill="#ff8fa3" opacity=".55"/>
  <path d="M70 116Q100 158 130 116Z" fill="#a3243a" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="100" cy="138" rx="13" ry="8" fill="#ff8fa3"/>
</svg>
</div>

<div id="front" aria-hidden="true"></div>
<div id="table" class="abs crayon" aria-hidden="true"></div>
<div id="track" aria-hidden="true"></div>

<svg style="display:none" aria-hidden="true">
  <filter id="crayon-filter">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script>
(function(){
  var sky='',fr='',i,s,u=function(n,w){return '<svg class="i crayon" width="'+w+'" height="'+w+'"><use href="#'+n+'"/></svg>'};
  /* clouds */
  for(i=0;i<3;i++)sky+='<div class="abs cl" style="--y:'+(5+i*11)+'%;--t:'+(90+i*25)+'s;--dl:-'+(i*38)+'s"><svg class="i crayon" width="'+(110+(i*37)%70)+'" height="'+(55+(i*19)%35)+'" viewBox="0 0 96 48"><use href="#cloud"/></svg></div>';
  document.getElementById('sky').innerHTML=sky;
  /* hearts puffing from the pizza */
  [-14,0,14].forEach(function(o,k){fr+='<div class="abs ht" style="left:calc(50% + '+(o*1.6)+'vmin);top:24%;--dl:-'+(k*2)+'s">'+u('heart',28)+'</div>'});
  /* falling coins: the 10,000 BTC being spent */
  for(i=0;i<5;i++)fr+='<div class="abs fall" style="left:'+(8+i*20)+'%;--t:'+(16+(i*5)%9)+'s;--dl:-'+(i*4.2)+'s"><div class="sw">'+u('coin',34)+'</div></div>';
  /* confetti */
  var cc=['#d9536a','#f5c542','#2b8a3e','#5aa9e6'];
  for(i=0;i<8;i++)fr+='<div class="abs fall dot" style="left:'+(4+i*12.5)+'%;--c:'+cc[i%4]+';--t:'+(24+(i*3)%10)+'s;--dl:-'+(i*3)+'s"></div>';
  /* floating pizza stuff */
  var n=['slice','cslice','box','pizza'];
  for(i=0;i<n.length;i++){s=56+(i*17)%30;
    fr+='<div class="abs fl" style="left:'+(10+i*24)+'%;--t:'+(44+(i*7)%16)+'s;--dl:-'+(i*5.3)+'s"><div class="sw">'+u(n[i],s)+'</div></div>'}
  document.getElementById('front').innerHTML=fr;
  /* conveyor on the tablecloth */
  var seq=['box','slice','coin','pizza','cslice','coin'],t='';
  for(i=0;i<12;i++)t+=u(seq[i%6],44);
  document.getElementById('track').innerHTML='<div class="abs track">'+t+t+'</div>';
})();
</script>
</body>
</html>
